[package]
name = "ankerstatus"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.0"
anyhow = "1.0.102"
axum = "0.8"
btleplug = "0.12.0"
cbc = "0.2.0"
chrono = "0.4.44"
cipher = "0.5.1"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
env_logger = "0.11.10"
futures = "0.3.32"
hex-literal = "1.1.0"
log = "0.4.29"
ratatui = "0.30.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }
